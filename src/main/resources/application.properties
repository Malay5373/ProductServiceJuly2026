spring.application.name=ProductServiceJuly26
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/productservicedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.profiles.active=database

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=${spring.application.name}

# Set JWT_SECRET to a random base64 secret of at least 32 bytes in every environment.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
